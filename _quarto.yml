  page-footer:
    left: "Jayanth Uppaluri &copy; <script>document.write(new Date().getFullYear())</script>"
    center: "Built on the [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template) by [Dr. Gang He](http://drganghe.github.io)"
