website:
  title: "Jayanth Uppaluri"
  description: "Jayanth Uppaluri: PhD candidate in Public Policy (Politics and Institutions) at Harvard Kennedy School"

  navbar:
    background: light

    left:
      - text: Publications
        href: publications.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Music
        href: music.qmd
      - text: Contact
        href: contact.qmd

    right:
      - text: CV
        href: files/Uppaluri_CV.pdf
